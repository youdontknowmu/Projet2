[project]
name = "projet2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "youdontknowmu", email = "youdontknowmu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
]

[project.scripts]
projet2 = "projet2:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
